app = 'budget-server-aged-canyon-8994'
primary_region = 'lax'

[build]
[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[mounts] 
source = "rosebud_data"
destination = "/data"